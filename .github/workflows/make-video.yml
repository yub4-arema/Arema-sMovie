name: make-video
on:
  workflow_dispatch:
    inputs:
      speaker:
        description: "VOICEVOXの話者名(一部でOK。例: ナースロボ)。空ならpyopenjtalk"
        default: "ナースロボ"
      style:
        description: "スタイル名"
        default: "ノーマル"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-ipafont-gothic
          pip install --only-binary=:all: pyopenjtalk-plus pillow numpy
      - name: Start VOICEVOX engine
        if: ${{ inputs.speaker != '' }}
        run: |
          docker run -d --name vv -p 50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:50021/version && break; sleep 3; done
      - name: Build video
        env:
          VOICEVOX_SPEAKER: ${{ inputs.speaker }}
          VOICEVOX_STYLE: ${{ inputs.style }}
        run: python3 video/make_video.py
      - uses: actions/upload-artifact@v4
        with:
          name: explain-mp4
          path: video/out/explain.mp4
